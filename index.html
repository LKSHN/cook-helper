<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171A">
<title>The Rail</title>
<meta name="description" content="Offline recipe & dressing reference for your menu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Rail">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- Header -->
  <header class="rail-header">
    <div class="header-top">
      <h1 class="brand">THE RAIL <span id="buildVersion" class="build-version"></span></h1>
      <button id="addBtn" class="btn-add" aria-label="Add recipe">+</button>
    </div>
  </header>

  <!-- Top-level view tabs -->
  <nav class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="recap">Recap</button>
    <button class="view-tab" data-view="mep">MEP</button>
    <button class="view-tab" data-view="shop">Shop</button>
  </nav>

  <div class="search-wrap" id="searchWrap">
    <input id="searchInput" type="text" placeholder="Find a dish, sauce, ingredient…" autocomplete="off">
  </div>

  <!-- Recap view -->
  <div id="recapView" class="view">
    <!-- Station anchors: jump to a section, don't filter -->
    <nav class="station-tabs" id="stationTabs">
      <button class="tab" data-cat="all">All</button>
      <button class="tab" data-cat="starters">Starters</button>
      <button class="tab" data-cat="mains">Mains</button>
      <button class="tab" data-cat="desserts">Desserts</button>
    </nav>

    <main id="cardList" class="card-list"></main>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state" hidden>
      <p class="empty-title">Nothing here yet.</p>
      <p class="empty-sub">Tap + to punch in your first recipe.</p>
    </div>
  </div>

  <!-- MEP view -->
  <div id="mepView" class="view" hidden>
    <nav class="mep-mode-tabs" id="mepModeTabs">
      <button class="mep-mode-tab active" data-mode="before">Before</button>
      <button class="mep-mode-tab" data-mode="after">After</button>
    </nav>

    <div id="mepBeforeList" class="mep-list"></div>
    <div id="mepAfterList" class="mep-list" hidden></div>
  </div>

  <!-- Shop view (placeholder for now) -->
  <div id="shopView" class="view" hidden>
    <div class="empty-state">
      <p class="empty-title">Shop is coming soon.</p>
    </div>
  </div>

</div>

<!-- Recipe view / edit form (one merged surface for viewing and editing) -->
<div id="formOverlay" class="overlay" hidden>
  <form id="recipeForm" class="recipe-form">
    <div class="form-header">
      <button type="button" id="formClose" class="btn-close" aria-label="Close">&times;</button>
      <h2 id="formTitle">New Recipe</h2>
      <button type="submit" class="btn-save">Save</button>
    </div>

    <input type="hidden" id="recipeId">

    <label class="field-label">Dish / item name</label>
    <input type="text" id="fName" required placeholder="e.g. Charred Octopus">

    <label class="field-label">Station</label>
    <select id="fCategory">
      <option value="starters">Starters</option>
      <option value="mains">Mains</option>
      <option value="desserts">Desserts</option>
    </select>

    <label class="field-label">Ingredients</label>
    <div id="ingredientRows" class="ingredient-rows"></div>
    <div class="form-btn-row">
      <button type="button" id="addIngredient" class="btn-secondary">+ Add ingredient</button>
      <button type="button" id="addSeparator" class="btn-secondary">+ Add separator</button>
    </div>

    <label class="field-label">Method</label>
    <div id="stepRows" class="step-rows"></div>
    <button type="button" id="addStep" class="btn-secondary">+ Add step</button>

    <label class="field-label">Photos</label>
    <div id="photoThumbs" class="photo-thumbs"></div>
    <input type="file" id="fPhotoInput" class="visually-hidden" accept="image/*" multiple>
    <label for="fPhotoInput" class="btn-secondary">+ Add photo</label>

    <label class="field-label">Allergens / notes</label>
    <input type="text" id="fNotes" placeholder="e.g. contains nuts, shellfish">

    <button type="button" id="fDelete" class="btn-danger" hidden>Delete this recipe</button>
  </form>
</div>

<!-- Photo lightbox -->
<div id="lightboxOverlay" class="overlay lightbox-overlay" hidden>
  <img id="lightboxImg" class="lightbox-img" alt="">
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
